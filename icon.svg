<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="HarmonyOS UI Icons">
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E7BFF"/>
      <stop offset="1" stop-color="#0A3FC4"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect x="4" y="4" width="88" height="88" rx="22" fill="url(#hbg)"/>

  <!-- icon grid: three outlined marks + one filled, the way an icon set is used -->
  <g stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="33" cy="33" r="9"/>
    <rect x="55" y="24" width="18" height="18" rx="5"/>
    <path d="M33 57.5c0-3.6 2.9-6.5 6.5-6.5S46 53.9 46 57.5 43.1 64 39.5 64 33 61.1 33 57.5z"/>
  </g>
  <g fill="#FFFFFF">
    <path d="M64 57.5c0-3.6 2.9-6.5 6.5-6.5S77 53.9 77 57.5 74.1 64 70.5 64 64 61.1 64 57.5z"/>
  </g>

  <!-- motion cue: an arc suggesting the SMIL animation layer -->
  <path d="M24 72a24 24 0 0 0 48 0" stroke="#9FC2FF" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.85"/>
  <circle cx="72" cy="72" r="4" fill="#9FC2FF"/>
</svg>
